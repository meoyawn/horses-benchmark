<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#141c19">
  <title>61solmax · Equine Study</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="wordmark"><span class="brand-mark" aria-hidden="true"></span> Equine Study</div>
      <div class="header-actions">
        <a class="back-link" href="/"><span aria-hidden="true">←</span> Models</a>
        <button class="reset" type="button" id="reset"><span class="reset-icon" aria-hidden="true">↺</span> Reset view</button>
      </div>
    </header>

    <section class="stage" aria-labelledby="title">
      <div class="scene" id="scene"></div>
      <div class="specimen">
        <div class="coat-label"><span aria-hidden="true"></span> Bay coat</div>
        <h1 id="title">Horse</h1>
      </div>
      <div class="loading" id="loading" role="status">Sculpting the horse…</div>
      <div class="guide" aria-hidden="true">
        <span class="drag-hint">Drag to orbit</span><span class="touch-hint">Swipe to orbit</span>
        <i></i><span class="drag-hint">Scroll to zoom</span><span class="touch-hint">Pinch to zoom</span>
      </div>
    </section>

    <footer class="dock">
      <div class="control">
        <span class="field-label" id="gait-label">Gait</span>
        <div class="segments" role="group" aria-labelledby="gait-label">
          <button type="button" data-gait="stand" aria-pressed="true">Stand</button>
          <button type="button" data-gait="walk" aria-pressed="false">Walk</button>
          <button type="button" data-gait="trot" aria-pressed="false">Trot</button>
        </div>
        <button class="pause" type="button" id="pause" aria-label="Pause motion" title="Pause motion">
          <span class="play-icon" aria-hidden="true"></span>
        </button>
      </div>
      <div class="control">
        <span class="field-label" id="camera-label">Camera</span>
        <div class="segments" role="group" aria-labelledby="camera-label">
          <button type="button" data-view="angle" aria-pressed="true">Three-quarter</button>
          <button type="button" data-view="profile" aria-pressed="false">Profile</button>
          <button type="button" data-view="head" aria-pressed="false">Head</button>
        </div>
      </div>
    </footer>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
